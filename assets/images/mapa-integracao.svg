<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- Título -->
  <text x="50" y="40" font-size="28" font-weight="bold" fill="#000">Mapa de Integrações</text>
  <text x="50" y="65" font-size="14" fill="#666">SPLITHUB</text>

  <!-- Cliente (esquerda) -->
  <rect x="50" y="120" width="200" height="400" rx="10" fill="#B3E5FC" stroke="#0288D1" stroke-width="2"/>
  <text x="150" y="330" font-size="20" font-weight="bold" fill="#000" text-anchor="middle">Cliente</text>

  <!-- Integrações (Cliente -> Núcleo) -->
  <!-- DFs (Essential - Red) -->
  <line x1="250" y1="160" x2="380" y2="160" stroke="#E53935" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="310" y="145" font-size="12" fill="#E53935" font-weight="bold">DFs</text>

  <!-- DARF RAD (Essential - Red) -->
  <line x1="250" y1="200" x2="380" y2="200" stroke="#E53935" stroke-width="3"/>
  <line x1="380" y1="200" x2="250" y2="200" stroke="#E53935" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="310" y="185" font-size="12" fill="#E53935" font-weight="bold">Darf RAD</text>

  <!-- Comp. Pagto (Essential - Red) -->
  <line x1="250" y1="240" x2="380" y2="240" stroke="#E53935" stroke-width="3"/>
  <line x1="380" y1="240" x2="250" y2="240" stroke="#E53935" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="310" y="225" font-size="12" fill="#E53935" font-weight="bold">Comp. de Pagto.</text>

  <!-- Ciclo Crédito/Débito (Optional - Green) -->
  <line x1="250" y1="300" x2="380" y2="300" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="310" y="285" font-size="12" fill="#4DB8A8" font-weight="bold">Ciclo Crédito/Débito</text>

  <!-- Automações (Optional - Green) -->
  <line x1="250" y1="340" x2="380" y2="340" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="310" y="325" font-size="12" fill="#4DB8A8" font-weight="bold">Automações</text>

  <!-- Sync Fornecedores (Optional - Green) -->
  <line x1="250" y1="380" x2="380" y2="380" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="380" y1="380" x2="250" y2="380" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="310" y="365" font-size="12" fill="#4DB8A8" font-weight="bold">Sync Fornecedores</text>

  <!-- Sync Contratos (Optional - Green) -->
  <line x1="250" y1="420" x2="380" y2="420" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="380" y1="420" x2="250" y2="420" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="310" y="405" font-size="12" fill="#4DB8A8" font-weight="bold">Sync Contratos</text>

  <!-- Info. BI (Optional - Green) -->
  <line x1="250" y1="460" x2="380" y2="460" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="310" y="445" font-size="12" fill="#4DB8A8" font-weight="bold">Info. BI</text>

  <!-- SplitHub Núcleo (centro) -->
  <rect x="380" y="100" width="350" height="500" rx="5" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="555" y="125" font-size="14" fill="#666" text-anchor="middle" font-weight="bold">SplitHub Núcleo</text>

  <!-- Módulos do Núcleo -->
  <g>
    <!-- Conciliação -->
    <rect x="400" y="145" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="175" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Conciliação</text>

    <!-- RAD -->
    <rect x="400" y="205" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="235" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">RAD</text>

    <!-- Gestão de crédito -->
    <rect x="400" y="265" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="295" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Gestão de crédito</text>

    <!-- Gestão de Inconsistências -->
    <rect x="400" y="325" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="355" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Gestão de Inconsistências</text>

    <!-- Gestão Fornecedores -->
    <rect x="400" y="385" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="415" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Gestão Fornecedores</text>

    <!-- Gestão de contratos -->
    <rect x="400" y="445" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="475" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Gestão de contratos</text>

    <!-- Analytics -->
    <rect x="400" y="505" width="310" height="50" rx="5" fill="#4DB8A8" stroke="none"/>
    <text x="555" y="535" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">Analytics</text>
  </g>

  <!-- Integrações Externas (Núcleo -> Órgãos) -->
  <!-- Agenda A.A (Blue) -->
  <line x1="690" y1="170" x2="800" y2="170" stroke="#1E88E5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="745" y="155" font-size="12" fill="#1E88E5" font-weight="bold">Agenda A.A</text>

  <!-- RAD CBS/IBS (Blue) -->
  <line x1="690" y1="230" x2="800" y2="230" stroke="#1E88E5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="745" y="215" font-size="12" fill="#1E88E5" font-weight="bold">RAD CBS/IBS</text>

  <!-- Pagto RAD (Blue) -->
  <path d="M 690 400 Q 750 350, 800 350" stroke="#1E88E5" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="720" y="370" font-size="12" fill="#1E88E5" font-weight="bold">Pagto RAD</text>

  <!-- Receita Federal - Comitê Gestor -->
  <rect x="800" y="140" width="350" height="150" rx="5" fill="#E0E0E0" stroke="#999" stroke-width="1"/>
  <text x="975" y="190" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Receita Federal</text>
  <text x="975" y="215" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Comitê Gestor</text>

  <!-- PSP -->
  <rect x="800" y="320" width="350" height="100" rx="5" fill="#E0E0E0" stroke="#999" stroke-width="1"/>
  <text x="975" y="375" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">PSP</text>

  <!-- Legenda -->
  <g transform="translate(50, 680)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#000">LEGENDA</text>

    <!-- Essenciais -->
    <line x1="0" y1="20" x2="30" y2="20" stroke="#E53935" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="40" y="25" font-size="12" fill="#000">Integrações essenciais</text>

    <!-- Opcionais -->
    <line x1="350" y1="20" x2="380" y2="20" stroke="#4DB8A8" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="390" y="25" font-size="12" fill="#000">Integrações opcionais</text>

    <!-- Órgãos Externos -->
    <line x1="750" y1="20" x2="780" y2="20" stroke="#1E88E5" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="790" y="25" font-size="12" fill="#000">Integrações com órgãos externos</text>
  </g>

  <!-- Definição das setas -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#E53935" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4DB8A8" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E88E5" />
    </marker>
  </defs>
</svg>